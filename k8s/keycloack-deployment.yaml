# ── Keycloak ──────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      nodeSelector:
        node-role: worker
      imagePullSecrets:
      - name: regcred
      containers:
      - name: keycloak
        image: keycloak/keycloak:26.0
        args: ["start", "--import-realm"]
        ports:
        - containerPort: 8081
        env:
        - name: KEYCLOAK_ADMIN
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: KEYCLOAK_ADMIN
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: KEYCLOAK_ADMIN_PASSWORD
        # Use the real domain so tokens have correct issuer URL
        - name: KC_HOSTNAME
          value: "aegis.coevolution-project.eu"
        - name: KC_HTTP_PORT
          value: "8081"
        - name: KC_PROXY
          value: "edge"               # tells Keycloak it sits behind a proxy
        - name: KC_HOSTNAME_STRICT_BACKCHANNEL
          value: "false"
        volumeMounts:
        - name: keycloak-data
          mountPath: /opt/keycloak/data
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
      volumes:
      - name: keycloak-data
        persistentVolumeClaim:
          claimName: keycloak-data-pvc
 
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  type: NodePort
  selector:
    app: keycloak
  ports:
  - name: http
    port: 8081
    targetPort: 8081
    nodePort: 30012      # keep NodePort for direct backend access
